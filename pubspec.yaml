name: third_intermediate_iraq
description: 'دليلك الدراسي للثالث المتوسط في العراق: الكتب والامتحانات والمراجعة الذكية.'
publish_to: 'none'
version: 1.1.0+5
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  http: ^1.2.2
  path_provider: ^2.1.5
  pdfrx: ^2.4.1
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  share_plus: ^10.1.4
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/exams/chemistry/ # retained for previously saved exam sheets; not shown as a separate subject
    - assets/exams/arabic/
    - assets/exams/اللغة_الإنكليزية/
    - assets/exams/الرياضيات/
    - assets/exams/الاجتماعيات/
    - assets/exams/الأحياء/
    - assets/exams/الفيزياء/
